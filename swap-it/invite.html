<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Cache-Control" content="no-store">
  <title>Swap It. Family Invite</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fff8eb; color: #2d2925; padding: 24px; }
    main { width: min(100%, 440px); padding: 32px 24px; border: 1px solid #eadfce; border-radius: 24px; background: #fffdf8; box-shadow: 0 16px 40px rgba(73, 57, 39, .09); text-align: center; }
    .mark { width: 64px; height: 64px; display: grid; place-items: center; margin: 0 auto 18px; border-radius: 18px; background: #f5c768; font-size: 30px; }
    h1 { margin: 0 0 8px; font-size: 25px; }
    p { margin: 0 0 22px; color: #655e57; line-height: 1.55; }
    .code { margin: 0 0 18px; padding: 14px; border-radius: 14px; background: #f7f1e6; font: 800 21px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 3px; }
    .actions { display: grid; gap: 10px; }
    a, button { width: 100%; min-height: 48px; display: grid; place-items: center; border: 0; border-radius: 14px; padding: 12px 16px; font: inherit; font-weight: 750; text-decoration: none; cursor: pointer; }
    .primary { background: #d58a2e; color: white; }
    .secondary { background: #f2e6d4; color: #4f3b28; }
    .stores { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
    .status { min-height: 22px; margin: 14px 0 0; font-size: 14px; color: #655e57; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">🏠</div>
    <h1 id="title"></h1>
    <p id="body"></p>
    <div class="code" id="code" hidden></div>
    <div class="actions">
      <a class="primary" id="open-app" href="#"></a>
      <button class="secondary" id="copy-code" type="button"></button>
    </div>
    <div class="stores">
      <a class="secondary" href="https://apps.apple.com/app/id6762584972" rel="noopener noreferrer">App Store</a>
      <a class="secondary" href="https://play.google.com/store/apps/details?id=com.sheepbeansgames.shelfory" rel="noopener noreferrer">Google Play</a>
    </div>
    <div class="status" id="status" role="status" aria-live="polite"></div>
  </main>
  <script>
    (() => {
      const copy = {
        'zh-Hant': {
          title: '加入該換了吧家庭',
          body: '開啟 App 後確認家庭與身分，才會完成加入。',
          invalid: '這個邀請連結不完整，請向管理員索取新的連結。',
          open: '開啟該換了吧',
          copy: '複製邀請碼',
          copied: '已複製邀請碼'
        },
        'zh-Hans': {
          title: '加入该换了吧家庭',
          body: '打开 App 后确认家庭与身份，才会完成加入。',
          invalid: '这个邀请链接不完整，请向管理员索取新的链接。',
          open: '打开该换了吧',
          copy: '复制邀请码',
          copied: '已复制邀请码'
        },
        en: {
          title: 'Join a family on Swap It.',
          body: 'Open the app and confirm the family and identity before joining.',
          invalid: 'This invite link is incomplete. Ask the owner for a new link.',
          open: 'Open Swap It.',
          copy: 'Copy invite code',
          copied: 'Invite code copied'
        },
        ja: {
          title: 'Swap It. の家族に参加',
          body: 'Appを開き、家族とメンバー名を確認すると参加が完了します。',
          invalid: 'この招待リンクは無効です。管理者に新しいリンクを依頼してください。',
          open: 'Swap It.を開く',
          copy: '招待コードをコピー',
          copied: '招待コードをコピーしました'
        },
        ko: {
          title: 'Swap It. 가족에 참여',
          body: 'App을 열고 가족과 이름을 확인해야 참여가 완료돼요.',
          invalid: '초대 링크가 올바르지 않아요. 관리자에게 새 링크를 요청하세요.',
          open: 'Swap It. 열기',
          copy: '초대 코드 복사',
          copied: '초대 코드를 복사했어요'
        }
      };
      const browserLanguage = navigator.language || 'en';
      const language = browserLanguage.startsWith('zh')
        ? (browserLanguage.toLowerCase().includes('hans') || /-cn|-sg/i.test(browserLanguage) ? 'zh-Hans' : 'zh-Hant')
        : browserLanguage.startsWith('ja') ? 'ja'
        : browserLanguage.startsWith('ko') ? 'ko'
        : 'en';
      const text = copy[language];
      document.documentElement.lang = language;
      const rawCode = new URLSearchParams(location.search).get('code') || '';
      const code = rawCode.trim().toUpperCase();
      const valid = /^[ABCDEFGHJKMNPQRSTUVWXYZ23456789]{10}$/.test(code);
      document.getElementById('title').textContent = text.title;
      document.getElementById('body').textContent = valid ? text.body : text.invalid;
      document.getElementById('open-app').textContent = text.open;
      document.getElementById('copy-code').textContent = text.copy;
      if (!valid) {
        document.getElementById('open-app').hidden = true;
        document.getElementById('copy-code').hidden = true;
        return;
      }
      const codeElement = document.getElementById('code');
      codeElement.textContent = code;
      codeElement.hidden = false;
      document.getElementById('open-app').href = 'shelfory:///swap-it/invite?code=' + encodeURIComponent(code);
      document.getElementById('copy-code').addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(code);
          document.getElementById('status').textContent = text.copied;
        } catch (_) {
          const selection = window.getSelection();
          const range = document.createRange();
          range.selectNodeContents(codeElement);
          selection.removeAllRanges();
          selection.addRange(range);
        }
      });
    })();
  </script>
</body>
</html>
